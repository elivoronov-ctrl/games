<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
addEventListener('resize', resize); resize();
const TAU = Math.PI * 2, rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const HI_KEY = 'starlit-plunder-hi';
let hiScore = 0; try { hiScore = +localStorage.getItem(HI_KEY) || 0; } catch (e) {}

// ---------- audio ----------
let AC = null, master = null, muted = false;

let shotT = 0;
const SFX = {
  shot() { const n = performance.now(); if (n - shotT < 70) return; shotT = n; tone(880, 0.06, 'square', 0.025, -500); },
  eshot() { tone(300, 0.1, 'sawtooth', 0.02, -150); },
  hit() { noise(0.05, 0.06, 3000); },
  boom(big) { noise(big ? 0.9 : 0.35, big ? 0.3 : 0.14, big ? 400 : 900); tone(big ? 60 : 110, big ? 0.8 : 0.3, 'sine', 0.2, -40); },
  coin() { tone(1320, 0.06, 'square', 0.04); tone(1760, 0.08, 'square', 0.04, 0, 0.05); },
  power() { [523, 784, 1046].forEach((f, i) => tone(f, 0.15, 'triangle', 0.08, 0, i * 0.06)); },
  hurt() { tone(160, 0.2, 'sawtooth', 0.12, -80); noise(0.15, 0.1, 600); },
  bomb() { noise(1.2, 0.35, 300); tone(80, 1.2, 'sine', 0.3, -50); },
  blip() { tone(660, 0.03, 'square', 0.02); },
  obj() { [659, 880, 1175].forEach((f, i) => tone(f, 0.2, 'triangle', 0.1, 0, i * 0.08)); },
};
let musT = 0, musI = 0;
function music(dt) { if (!AC || muted || state !== 'play') return; musT -= dt; if (musT > 0) return; const bpm = 128 + chapter * 4; musT += 60 / bpm / 2; const i = musI++;
  const prog = [110, 87.3, 130.8, 98][Math.floor(i / 16) % 4];
  if (i % 2 === 0) tone(prog, 0.18, 'sawtooth', 0.045, 0); if (i % 8 === 0) { tone(55, 0.3, 'sine', 0.18, -20); } if (i % 8 === 4) noise(0.12, 0.07, 1800); if (i % 2) noise(0.03, 0.025, 7000);
  if (i % 4 === 2 || Math.random() < 0.2) tone(prog * 4 * Math.pow(2, [0, 3, 7, 10, 12][(i * 7) % 5] / 12), 0.15, 'triangle', 0.035); }

// ---------- story ----------
const CAST = {
  vex: { n: 'Captain Juniper Vex', c: '#ff7a5a', hair: '#2a1a40', skin: '#c88a64', hat: true },
  bolt: { n: 'Bolt (robo-parrot)', c: '#5affc8', robot: true },
  grim: { n: 'Admiral Grimsby', c: '#6a8aff', hair: '#e0e0e0', skin: '#e8c0a0', crown: true },
  pip: { n: 'Pip, the cabin kid', c: '#ffcf5a', hair: '#ff9a3a', skin: '#f0c090' },

const CHAPTERS = [
  { name: 'The Empty Cove', world: 2800, scene: [['vex', 'The Crown took my crew, my maps and my good hat. They left me one ship: the Starlit.'], ['bolt', 'SQUAWK. And me. Do not forget me. Also we are broke.'], ['vex', 'Then we start small. Three Crown cargo barges are drifting through the cove. Crack them open.'], ['bolt', 'Move with WASD or the left stick. Aim with the mouse or the right stick. Hold to fire!']], obj: 'barges' },
  { name: 'The Rock Garden', world: 2800, scene: [['bolt', 'The barge logs mention a star-map, shredded and hidden in the Rock Garden asteroids.'], ['vex', 'Five fragments. Five rocks worth shooting. Watch out for drifting mines.'], ['pip', '(over the radio) Captain? Is that you? They have us at Fort Halcyon! Hurry!'], ['vex', 'Pip! Hold on, kid. We need that map first.']], obj: 'fragments' },
  { name: 'Convoy of the Crown', world: 3000, scene: [['grim', 'Juniper Vex. Still flying that bucket? My convoy will crush you.'], ['vex', 'Your treasure galleon is fat and slow, Admiral. I will be taking it.'], ['bolt', 'Galleon fires broadsides from both flanks. Attack its nose or its tail. SQUAWK.']], obj: 'galleon' },
  { name: 'Fort Halcyon', world: 3000, scene: [['bolt', 'Fort Halcyon. Four shield generators keep the prison pods locked.'], ['vex', 'Smash the generators, then scoop up every crew pod. Nobody gets left behind.'], ['pip', 'We can see you through the window! Go, Captain, go!']], obj: 'fort' },
  { name: 'The Veil Nebula', world: 2600, scene: [['pip', 'Thanks for the rescue, Captain! But the Crown is hunting us. They are hiding in the nebula.'], ['bolt', 'Sensors are blind in here. They will come out of the fog. Fifteen hunters at least.'], ['vex', 'Then we fight blind. Stay sharp, crew.']], obj: 'hunters' },
  { name: 'The Iron Admiral', world: 2600, scene: [['grim', 'Enough! The Dreadnought Sovereign will end your little rebellion.'], ['bolt', 'Four turrets shield its core. Take out the turrets, then hit the core. Bombs help. SQUAWK.'], ['vex', 'For the crew. For the stars. FIRE EVERYTHING!']], obj: 'boss' },
];
const EPILOGUE = [['grim', 'Impossible... my Sovereign...'], ['pip', 'We did it! The whole crew is back!'], ['bolt', 'And the Admiral\'s treasury is very, very full. SQUAWK.'], ['vex', 'Set a course for anywhere, crew. The stars are ours again.']];

// ---------- state ----------
let state = 'title', chapter = 0, score = 0, chapterStartScore = 0, power = 1, bombs = 3, hull = 100;
let ship, enemies, pb, eb, parts, pickups, rocks, world, cam = { x: 0, y: 0 }, shake = 0, objective = {}, timeIn = 0, flashMsg = '', flashT = 0, fogR = 0;
let sceneLines = [], sceneI = 0, sceneChars = 0, sceneNext = null, stars = [];
function makeStars() { stars = []; for (let l = 0; l < 3; l++) for (let i = 0; i < 90; i++) stars.push({ x: Math.random() * 2000, y: Math.random() * 2000, l, s: 0.6 + l * 0.6 + Math.random(), tw: Math.random() * 6 }); }
makeStars();
const nebCv = document.createElement('canvas');
function buildNebula(hue) { nebCv.width = 512; nebCv.height = 512; const g = nebCv.getContext('2d'); for (let i = 0; i < 14; i++) { const x = Math.random() * 512, y = Math.random() * 512, r = 80 + Math.random() * 160; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `hsla(${hue + Math.random() * 60},80%,55%,0.16)`); gr.addColorStop(1, 'hsla(0,0%,0%,0)'); g.fillStyle = gr; for (const ox of [-512, 0, 512]) for (const oy of [-512, 0, 512]) { g.save(); g.translate(ox, oy); g.fillRect(-ox, -oy, 512, 512); g.restore(); } } }

// ---------- entities ----------
function mkEnemy(type, x, y, o = {}) {
  const D = { cutter: { hp: 30, r: 16, sp: 230, rw: 60, col: '#6a8aff' }, gunship: { hp: 90, r: 24, sp: 140, rw: 150, col: '#8a6aff' }, barge: { hp: 220, r: 40, sp: 50, rw: 300, col: '#c8a060' },
    mine: { hp: 10, r: 14, sp: 90, rw: 20, col: '#ff4a4a' }, turret: { hp: 140, r: 22, sp: 0, rw: 120, col: '#8aa0c8' }, gen: { hp: 380, r: 40, sp: 0, rw: 400, col: '#5affc8' },
    hunter: { hp: 50, r: 17, sp: 280, rw: 100, col: '#ff6aa0' }, galleon: { hp: 1600, r: 80, sp: 55, rw: 2000, col: '#d8b04a' }, boss: { hp: 3000, r: 110, sp: 35, rw: 5000, col: '#7a8aff' } }[type];
  const e = Object.assign({ type, x, y, vx: 0, vy: 0, a: rnd(0, TAU), hp: D.hp * (1 + chapter * 0.12), max: D.hp * (1 + chapter * 0.12), r: D.r, sp: D.sp * (1 + chapter * 0.05), rw: D.rw, col: D.col, cd: rnd(0.5, 2), t: rnd(0, 10), flash: 0 }, o);

}
function setupChapter(n) {

  ship = { x: world / 2, y: world / 2 + 600, vx: 0, vy: 0, a: -Math.PI / 2, r: 16, cd: 0, inv: 1.5, thrust: 0 };
  enemies = []; pb = []; eb = []; parts = []; pickups = []; rocks = []; hull = 100; bombs = 3; timeIn = 0; fogR = 0; shake = 0;
  chapterStartScore = score;
  buildNebula([260, 200, 20, 160, 300, 220][n]);

  for (let i = 0; i < (n === 1 ? 46 : 14); i++) { const r = rnd(26, 70); let x, y; do { x = rnd(100, world - 100); y = rnd(100, world - 100); } while (Math.hypot(x - ship.x, y - ship.y) < 350); rocks.push(mkRock(x, y, r)); }

  if (n === 1) { const fr = rocks.filter(r => Math.hypot(r.x - ship.x, r.y - ship.y) > 600).sort(() => Math.random() - 0.5).slice(0, 5); fr.forEach(r => { r.frag = true; r.r = Math.max(r.r, 50); r.hp = r.r * 2; }); for (let i = 0; i < 14; i++) mkEnemy('mine', rnd(200, world - 200), rnd(200, world - 200)); for (let i = 0; i < 6; i++) mkEnemy('cutter', rnd(200, world - 200), rnd(200, 1000)); objective = { need: 5, got: 0 }; }

  if (n === 3) { for (let i = 0; i < 4; i++) { const a = i / 4 * TAU + 0.4, gx = W2 + Math.cos(a) * 900, gy = W2 - 200 + Math.sin(a) * 800; mkEnemy('gen', gx, gy, { obj: true }); for (let k = 0; k < 2; k++) mkEnemy('turret', gx + Math.cos(a + k * Math.PI + 1.5) * 120, gy + Math.sin(a + k * Math.PI + 1.5) * 120); } for (let i = 0; i < 4; i++) mkEnemy('gunship', rnd(300, world - 300), rnd(300, 1200)); objective = { need: 4, crew: 0, crewNeed: 6 }; }
  if (n === 4) { fogR = 330; for (let i = 0; i < 5; i++) mkEnemy('hunter', rnd(200, world - 200), rnd(200, 900)); objective = { need: 15, spawnT: 2 }; }
  if (n === 5) { const b = mkEnemy('boss', W2, W2 - 500, { obj: true, shield: true }); b.turrets = []; for (let i = 0; i < 4; i++) { const t = mkEnemy('turret', 0, 0, { boss: b, off: i / 4 * TAU + TAU / 8, hp: 420 + 0 * i, max: 420 }); b.turrets.push(t); } objective = { need: 1 }; }

}
function mkRock(x, y, r) { const pts = []; const n = 9 + Math.floor(Math.random() * 4); for (let i = 0; i < n; i++) pts.push(r * rnd(0.75, 1.1)); return { x, y, r, vx: rnd(-20, 20), vy: rnd(-20, 20), rot: rnd(0, TAU), vr: rnd(-0.5, 0.5), pts, hp: r * 1.2 }; }
function objText() {

// ---------- input ----------
const keys = {}; let mouse = { x: 0, y: 0, down: false, used: false }, stL = { x: 0, y: 0, id: null }, stR = { x: 0, y: 0, id: null }, bombPressed = false;

});
addEventListener('keyup', e => { keys[e.code] = false; });

  if (e.pointerType === 'touch') { document.body.classList.add('touch'); if (state === 'scene') advanceScene(); return; }
  if (state === 'scene') { advanceScene(); return; }

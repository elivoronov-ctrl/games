    g.beginPath(); g.moveTo(-70, -30); g.quadraticCurveTo(0, -80, 70, -30); g.quadraticCurveTo(50, 60, 0, 70); g.quadraticCurveTo(-50, 60, -70, -30); g.fill();
    g.fillStyle = '#fff4e0'; g.beginPath(); g.moveTo(-40, 20); g.quadraticCurveTo(0, 0, 40, 20); g.quadraticCurveTo(20, 65, 0, 70); g.quadraticCurveTo(-20, 65, -40, 20); g.fill();
    g.strokeStyle = '#c0202a'; g.lineWidth = 4; g.beginPath(); g.moveTo(-40, -5); g.lineTo(-15, 0); g.moveTo(40, -5); g.lineTo(15, 0); g.stroke(); eye(-25, 5, 5); eye(25, 5, 5); g.fillStyle = '#1a0a14'; g.beginPath(); g.arc(0, 62, 6, 0, 7); g.fill(); }
  if (who === 'kasa') { g.fillStyle = '#d04a3a'; g.beginPath(); g.moveTo(0, -110); g.lineTo(-100, 20); g.quadraticCurveTo(0, 0, 100, 20); g.closePath(); g.fill(); g.strokeStyle = '#7a2a1a'; g.lineWidth = 3; for (let i = -3; i <= 3; i++) { g.beginPath(); g.moveTo(0, -110); g.lineTo(i * 30, 12); g.stroke(); }
    g.strokeStyle = '#6a3a1a'; g.lineWidth = 8; g.beginPath(); g.moveTo(0, 10); g.lineTo(0, 110); g.stroke(); eye(0, -45, 14); g.fillStyle = '#ff6a8a'; g.beginPath(); g.ellipse(0, 8, 12, 30, 0, 0, Math.PI); g.fill(); }
  if (who === 'rabbit') { g.fillStyle = '#ffe9a0'; g.beginPath(); g.arc(60, -70, 40, 0, 7); g.fill(); g.fillStyle = '#f8f4ff'; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(s * 22, -70, 14, 50, s * 0.15, 0, 7); g.fill(); }
    g.beginPath(); g.ellipse(0, 10, 55, 50, 0, 0, 7); g.fill(); g.fillStyle = '#ffb0c8'; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(s * 22, -70, 6, 36, s * 0.15, 0, 7); g.fill(); }
    eye(-20, 5, 7); eye(20, 5, 7); g.fillStyle = '#ff7a9a'; g.beginPath(); g.arc(0, 22, 5, 0, 7); g.fill(); }
  if (who === 'kappa') { g.fillStyle = '#4aa060'; g.beginPath(); g.arc(0, 0, 60, 0, 7); g.fill(); g.fillStyle = '#9adcf0'; g.beginPath(); g.ellipse(0, -52, 34, 12, 0, 0, 7); g.fill(); g.strokeStyle = '#2a6a40'; g.lineWidth = 4; g.stroke();
    g.fillStyle = '#e8c050'; g.beginPath(); g.moveTo(-22, 24); g.quadraticCurveTo(0, 50, 22, 24); g.quadraticCurveTo(0, 32, -22, 24); g.fill(); eye(-22, -5, 8); eye(22, -5, 8); g.fillStyle = '#2a6a40'; for (let i = 0; i < 5; i++) { g.beginPath(); g.arc(-48 + i * 24, -40, 8, Math.PI, 0); g.fill(); } }
  if (who === 'kettle') { g.fillStyle = '#3a3a46'; g.beginPath(); g.ellipse(0, 30, 80, 60, 0, 0, 7); g.fill(); g.fillRect(-30, -40, 60, 20); g.strokeStyle = '#5a5a68'; g.lineWidth = 10; g.beginPath(); g.arc(0, -30, 55, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
    g.fillStyle = '#3a3a46'; g.beginPath(); g.moveTo(70, 20); g.lineTo(120, -20); g.lineTo(125, -10); g.lineTo(78, 40); g.fill(); g.fillStyle = 'rgba(255,255,255,.4)'; for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(128 + i * 6, -30 - i * 18, 8 + i * 3, 0, 7); g.fill(); }
    eye(-25, 25, 6); eye(25, 25, 6); g.strokeStyle = '#ddd'; g.lineWidth = 4; g.beginPath(); g.moveTo(-30, 50); g.quadraticCurveTo(-10, 60, 0, 50); g.quadraticCurveTo(10, 60, 30, 50); g.stroke(); }
  if (who === 'fog') { g.fillStyle = 'rgba(170,170,190,.9)'; for (const [x, y, r] of [[-50, 10, 45], [0, -20, 55], [50, 10, 45], [-20, 35, 40], [25, 35, 40]]) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
    g.fillStyle = '#2a2a3a'; g.beginPath(); g.ellipse(-20, 5, 7, 10, 0, 0, 7); g.ellipse(20, 5, 7, 10, 0, 0, 7); g.fill(); g.fillStyle = 'rgba(150,200,255,.9)'; g.beginPath(); g.arc(-22, 24, 4, 0, 7); g.fill(); }
}

// ================= UI FLOW =================
const ov = $('#ov'), card = $('#card');
function show(html, binds) { card.innerHTML = html; ov.classList.add('show'); card.scrollTop = 0; for (const id in binds) { const el = card.querySelector('#' + id); if (el) el.onclick = () => { initAudio(); binds[id](); }; } }
function hide() { ov.classList.remove('show'); }
function setPlayUI(on) { $('#topBtns').style.display = on ? 'flex' : 'none'; $('#touch').style.display = on && touchUI ? 'block' : 'none'; }
function titleScreen() {
  state = 'title'; setPlayUI(false); ambient(false); loadLevel(Math.min(prog.unlocked, LEVELS.length - 1));
  const cont = prog.unlocked > 0 && prog.unlocked < LEVELS.length;
  show(`<h1>Steeped Spirits</h1><p style="color:#ffb070"><i>A teahouse puzzle story in six chapters</i></p>
    <p>Push steaming tea bowls onto the glowing mats so each spirit guest gets their cup. Bowls can only be pushed, never pulled, so think before you shove.</p>
    <ul><li>Coloured bowls belong on mats of the same colour.</li><li>Polished floors make bowls slide. Stones open paper screens. Spirit doors carry you between rooms.</li>
    <li>Match the <b>par</b> for ★★★. Dawdle too long and the tea goes cold!</li></ul>
    <table class="ctl"><tr><td>Move / push</td><td>Arrows · WASD · swipe · tap a tile</td></tr><tr><td>Undo / reset</td><td>Z or U / R · on-screen buttons</td></tr><tr><td>Pause / mute</td><td>P or Esc / M · ⏸ ♪</td></tr></table>
    <p class="small">Stars ${totalStars()}/${LEVELS.length * 3} · Best score ${bestTotal}</p>
    ${cont ? `<button class="btn alt" id="cont">Continue: Puzzle ${prog.unlocked + 1}</button>` : ''}<button class="btn" id="new">${cont ? 'Begin Again' : 'Open the Teahouse'}</button>
    ${prog.unlocked > 0 ? '<button class="btn ghost" id="sel">Puzzles</button>' : ''}`,
    { new: () => { startFrom(0); }, cont: () => startFrom(prog.unlocked), sel: () => selectScreen() });
}
function selectScreen() {
  let h = '<h2>Choose a Puzzle</h2>';
  CHAPTERS.forEach((c, ci) => { h += `<p class="small" style="margin-top:10px">Chapter ${ci + 1}: ${c.title}</p>`;
    LEVELS.forEach((l, i) => { if (l.ch !== ci) return; const b = prog.best[i]; h += `<button class="lv" id="lv${i}" ${i > prog.unlocked ? 'disabled' : ''}>${i + 1}<span>${b ? '★'.repeat(b.stars) : ''}</span></button>`; }); });
  h += '<br><button class="btn ghost" id="back">Back</button>';
  const binds = { back: () => titleScreen() }; LEVELS.forEach((l, i) => binds['lv' + i] = () => { loadLevel(i); play(); }); show(h, binds);
}
function startFrom(i) { const ch = LEVELS[i].ch, first = LEVELS.findIndex(l => l.ch === ch); loadLevel(i); if (i === first) story(CHAPTERS[ch].intro, `Chapter ${ch + 1}: ${CHAPTERS[ch].title}`, () => play()); else play(); }
function story(pages, heading, done, k = 0) {
  state = 'story'; setPlayUI(false); ambient(false);
  const [who, name, text] = pages[k];
  show(`${heading ? `<p class="small">${heading}</p>` : ''}<canvas class="portrait" id="por"></canvas><div class="speaker">${name}</div><p style="font-size:18px">${text}</p>
    <button class="btn" id="nx">${k < pages.length - 1 ? 'Next ▸' : 'Continue ▸'}</button>`, { nx: () => { SFX.page(); if (k < pages.length - 1) story(pages, heading, done, k + 1); else done(); } });
  drawPortrait($('#por'), who);
}
function play() { hide(); state = 'play'; setPlayUI(true); ambient(true); layout(); }
function solved() {
  state = 'solved'; ambient(false); SFX.win(); setPlayUI(false);
  const st = starsFor(moves, L.par), sc = st * 100 + Math.max(0, L.par * 2 - moves) * 3, prev = prog.best[li];
  if (!prev || sc > prev.score) prog.best[li] = { stars: Math.max(st, prev ? prev.stars : 0), score: sc };
  else if (st > prev.stars) prev.stars = st;
  prog.unlocked = Math.max(prog.unlocked, li + 1); bestTotal = Math.max(bestTotal, totalScore()); persist();
  const guest = CHAPTERS[L.ch].guest, lines = GUEST_LINES[guest], lastOfCh = li + 1 >= LEVELS.length || LEVELS[li + 1].ch !== L.ch;
  show(`<p class="small">Chapter ${L.ch + 1} · ${L.name}</p><h2>Tea is served!</h2><p style="font-size:30px;color:#ffd28a;letter-spacing:4px">${'★'.repeat(st)}${'☆'.repeat(3 - st)}</p>
    <p>${moves} moves (par ${L.par}) · +${sc} points</p><canvas class="portrait" id="por"></canvas><p><i>"${lines[li % lines.length]}"</i></p>
    <button class="btn" id="nx">${lastOfCh ? 'Continue the story ▸' : 'Next puzzle ▸'}</button><button class="btn ghost" id="re">Replay</button>`,
    { nx: () => next(lastOfCh), re: () => { loadLevel(li); play(); } });
  drawPortrait($('#por'), guest);
}
function next(lastOfCh) {
  const ch = L.ch;
  const go = () => { if (li + 1 >= LEVELS.length) return story(EPILOGUE, 'Epilogue: Every Lantern Lit', () => ending()); loadLevel(li + 1); if (lastOfCh) story(CHAPTERS[ch + 1].intro, `Chapter ${ch + 2}: ${CHAPTERS[ch + 1].title}`, () => play()); else play(); };
  if (lastOfCh) story(CHAPTERS[ch].outro, `${CHAPTERS[ch].title}: the guest departs`, go); else go();
}
function goneCold() {
  state = 'cold'; ambient(false); SFX.cold(); setPlayUI(false);
  show(`<h2 style="color:#9ac8ff">The tea went cold…</h2><canvas class="portrait" id="por"></canvas><p>${CHAPTERS[L.ch].name} sighs and drifts back across the river. Brew a fresh pot and try again.</p>
    <p class="small">You used ${moves} moves. Undo is free; wandering is not.</p><button class="btn" id="re">Brew Again</button><button class="btn ghost" id="t">Title</button>`, { re: () => { loadLevel(li); play(); }, t: () => titleScreen() });
  drawPortrait($('#por'), CHAPTERS[L.ch].guest);
}
function ending() {
  state = 'end'; setPlayUI(false); bestTotal = Math.max(bestTotal, totalScore()); persist(); SFX.win();
  show(`<h1>Every Lantern Lit</h1><canvas class="portrait" id="por"></canvas><p>Thirteen guests, twelve perfect cups, and one lonely fog who finally got warm. The Last Lantern Teahouse glows brighter than the moon.</p>
    <p style="font-size:22px">Score <b style="color:#ffd28a">${totalScore()}</b> · ★ ${totalStars()}/${LEVELS.length * 3}</p><p class="small">Best ${bestTotal}. Replay puzzles to chase three stars everywhere.</p>
    <button class="btn" id="sel">Puzzles</button><button class="btn ghost" id="t">Title</button>`, { sel: () => selectScreen(), t: () => titleScreen() });
  drawPortrait($('#por'), 'fog');
}
function togglePause() {
  if (state === 'play') { state = 'paused'; ambient(false); setPlayUI(false); $('#topBtns').style.display = 'flex';
    show(`<h2>Paused</h2><p>Chapter ${L.ch + 1} · ${L.name}</p><p>Moves ${moves} · Par ${L.par}</p><button class="btn" id="r">Resume</button><button class="btn ghost" id="rs">Reset Puzzle</button><button class="btn ghost" id="t">Title</button>`,
      { r: () => togglePause(), rs: () => { hide(); state = 'play'; resetLevel(); setPlayUI(true); ambient(true); }, t: () => titleScreen() }); }
  else if (state === 'paused') { hide(); state = 'play'; setPlayUI(true); ambient(true); }
}
window.__autoPause = () => { if (state === 'play') togglePause(); };

// ================= INPUT =================
const KEYD = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 };
addEventListener('keydown', e => {
  if (e.code in KEYD) { e.preventDefault(); if (state === 'play') { if (anim < 1) { queue = [KEYD[e.code]]; } else tryMove(KEYD[e.code]); } return; }
  if (e.code === 'KeyZ' || e.code === 'KeyU' || e.code === 'Backspace') { undo(); e.preventDefault(); }
  if (e.code === 'KeyR') resetLevel();
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') setMute(!muted);
});
const holdBtn = (id, fn) => { const el = $(id); let iv = null, to = null; el.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); fn(); to = setTimeout(() => { iv = setInterval(fn, 150); }, 320); });
  const stop = () => { clearTimeout(to); clearInterval(iv); }; el.addEventListener('pointerup', stop); el.addEventListener('pointercancel', stop); el.addEventListener('pointerleave', stop); };
const mv = d => () => { if (state !== 'play') return; if (anim < 1) queue = [d]; else tryMove(d); };
holdBtn('#bU', mv(0)); holdBtn('#bR', mv(1)); holdBtn('#bD', mv(2)); holdBtn('#bL', mv(3));
$('#bUndo').addEventListener('pointerdown', e => { e.preventDefault(); undo(); }); $('#bReset').addEventListener('pointerdown', e => { e.preventDefault(); resetLevel(); });
$('#bPause').addEventListener('click', () => togglePause()); $('#bMute').addEventListener('click', () => setMute(!muted));
let sw = null;
cv.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' && !touchUI) { touchUI = true; layout(); if (state === 'play') setPlayUI(true); } sw = { x: e.clientX, y: e.clientY, id: e.pointerId }; });
cv.addEventListener('pointerup', e => {
  if (!sw || sw.id !== e.pointerId || state !== 'play') { sw = null; return; }
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.hypot(dx, dy) > 30) { const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0); mv(d)(); return; }
  const tx = Math.floor((e.clientX - OX) / TS), ty = Math.floor((e.clientY - OY) / TS);
  if (tx < 0 || ty < 0 || tx >= L.w || ty >= L.h) return;
  const ddx = tx - P.x, ddy = ty - P.y;
  if (Math.abs(ddx) + Math.abs(ddy) === 1) { mv(ddx === 1 ? 1 : ddx === -1 ? 3 : ddy === 1 ? 2 : 0)(); return; }
  const p = pathTo(tx, ty); if (p && p.length) { queue = p; if (anim >= 1) tryMove(queue.shift()); }
});

// ================= LOOP =================
let last = performance.now(), T = 0, FR = 0;
function frame(now) {
  requestAnimationFrame(frame); FR++;
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  if (anim < 1) { anim += dt / animDur; if (anim >= 1) { anim = 1; if (queue.length && state === 'play') tryMove(queue.shift()); } }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground(T);
  if (L) {
    ctx.save(); if (shake > 0) { ctx.translate((Math.random() - 0.5) * shake * 40, (Math.random() - 0.5) * shake * 40); shake = Math.max(0, shake - dt); }
    drawBoard(T); const ents = [...bowls.map(b => ({ y: b.y, f: () => drawBowl(b, T) })), { y: P.y + 0.01, f: () => drawHana(T) }]; ents.sort((a, b) => a.y - b.y).forEach(e => e.f());
    drawParticles(dt); if (L.fog) drawFog(T); ctx.restore();
    if (flash > 0) { ctx.fillStyle = `rgba(200,155,255,${flash})`; ctx.fillRect(0, 0, W, H); flash -= dt; }
    if (state === 'play' || state === 'solving' || state === 'paused') drawHUD();
  }
}
resize(); titleScreen(); requestAnimationFrame(frame);

window.__ss = {
  get state() { return state; }, get level() { return li; }, get moves() { return moves; }, get player() { return [P.x, P.y]; }, get frames() { return FR; }, get count() { return LEVELS.length; },
  goto(i) { initAudio(); loadLevel(i); play(); return L.name; }, story(i) { startFrom(i); },
  move(d) { return tryMove(d); },
  solve() { if (!L.sol) return false; queue = [...L.sol].map(c => 'URDL'.indexOf(c)); if (anim >= 1) tryMove(queue.shift()); return queue.length; },
  stepSol(n) { const s = [...L.sol].slice(0, n).map(c => 'URDL'.indexOf(c)); s.forEach(d => { tryMove(d); anim = 1; }); return moves; },
};
</script>

<style>

input,textarea{font-size:max(16px,1em)!important;-webkit-user-select:text;user-select:text;touch-action:manipulation}
button{touch-action:manipulation}

.card{touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;max-height:calc(100% - 8px);overflow:auto}

.overlay{position:fixed;inset:0;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}

body{background:#0c3b4a;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff}

#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#ffffff66}
.tb{position:absolute;width:76px;height:76px;border-radius:50%;border:2px solid #ffffff66;background:#ff6b4a66;color:#fff;font-weight:bold;font-size:15px;pointer-events:auto;touch-action:none}
#bKick{right:calc(22px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom))}
#bDash{right:calc(110px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));width:60px;height:60px;background:#3fb5ff66;font-size:13px}

p{margin:6px 0;line-height:1.4}
.small{font-size:13px;opacity:.85}
.btn{display:inline-block;margin:8px 4px 0;padding:12px 22px;border-radius:14px;border:none;background:#ff6b4a;color:#fff;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #a13a22}
.btn.alt{background:#2a8fb0;box-shadow:0 4px 0 #17566b}
input#nm{padding:10px;border-radius:10px;border:2px solid #ffd27a;background:#022;color:#fff;width:200px;text-align:center}
.ups{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.up{flex:1 1 140px;background:#0a2f3b;border:2px solid #5fc6d9;border-radius:14px;padding:12px;cursor:pointer;color:#fff;font-size:14px}
.up b{display:block;font-size:17px;color:#ffd27a;margin-bottom:4px}
.up:hover{border-color:#ffd27a}
table.ctl{margin:8px auto;font-size:13px;border-collapse:collapse}
table.ctl td{padding:2px 8px;text-align:left}

<script>
/* iOS / touch hardening: audio unlock+resume, no zoom/scroll, safe-area insets, rotation resize */

  document.addEventListener('touchmove', function(e){ var t = e.target; if (t && t.closest && t.closest('.card,input,textarea')) return; if (e.cancelable) e.preventDefault(); }, {passive:false});
  window.SAFE = {t:0, r:0, b:0, l:0};

  function readSafe(){ if (!probe && document.body) { probe = document.createElement('div'); probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)'; document.body.appendChild(probe); }

<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
addEventListener('resize', resize); resize();

// ---------- constants ----------
const FW = 1000, FH = 600, GOAL = 180, GY0 = (FH - GOAL) / 2, GY1 = (FH + GOAL) / 2;
const LEAGUES = [
  { name: 'Puddle Cup', team: 'Puddle Prawns', opp: 1, goalie: false, spd: 0.72, rocks: 0, kelp: 0, waves: false, gull: false, sand: ['#f6e2ab', '#e9cd86'], water: '#62c9dc', oc: '#e86fa4', night: false },
  { name: 'Rockpool Cup', team: 'Barnacle Bruisers', opp: 1, goalie: true, spd: 0.82, rocks: 3, kelp: 0, waves: false, gull: false, sand: ['#efd9a0', '#d9bd7a'], water: '#4fb4cc', oc: '#8f8f9f', night: false },
  { name: 'Kelp Cup', team: 'Kelp Krakens', opp: 2, goalie: true, spd: 0.9, rocks: 2, kelp: 4, waves: true, gull: false, sand: ['#e6d29a', '#cbb372'], water: '#3aa0a8', oc: '#3fae5a', night: false },
  { name: 'Coral Cup', team: 'Coral Crushers', opp: 2, goalie: true, spd: 0.98, rocks: 3, kelp: 2, waves: true, gull: true, sand: ['#f8d6c0', '#e7b596'], water: '#3cb0d8', oc: '#c23b8a', night: false },
  { name: 'Abyss Cup', team: 'Abyssal Anglers', opp: 3, goalie: true, spd: 1.06, rocks: 3, kelp: 3, waves: true, gull: true, sand: ['#3a4b6e', '#283654'], water: '#13244a', oc: '#6a5cff', night: true },
];
const SHELLS = [{ n: 'Sunset', c: '#ff6b4a', l: 1 }, { n: 'Lagoon', c: '#3fb5ff', l: 3 }, { n: 'Mossback', c: '#55d36b', l: 5 }, { n: 'Royal', c: '#b46bff', l: 7 }, { n: 'Golden', c: '#ffd23f', l: 9 }];
const UPGRADES = [
  { id: 'speed', n: 'Swift Legs', d: '+12% scuttle speed' },
  { id: 'kick', n: 'Mighty Claw', d: '+18% kick power' },
  { id: 'dash', n: 'Quick Dash', d: 'Dash recharges 25% faster' },
  { id: 'size', n: 'Wide Shell', d: 'Bigger body, longer reach' },
  { id: 'sticky', n: 'Sticky Pincers', d: 'The pearl clings to you' },
  { id: 'power', n: 'Tide Shot', d: 'Kicks curve toward goal' },
  { id: 'buddy', n: 'Buddy Crab', d: 'A teammate joins (once)', once: true },
  { id: 'life', n: 'Spare Shell', d: '+1 shell (life)' },
];
const MATCH_TIME = 60;
const HI_KEY = 'pincer-league-hi';
let hiScore = 0; try { hiScore = +localStorage.getItem(HI_KEY) || 0; } catch (e) {}

// ---------- audio ----------
let AC = null, master = null, muted = false;
function initAudio() { if (AC) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = muted ? 0 : 0.45; master.connect(AC.destination); } catch (e) { AC = null; } }
function tone(f, d, type = 'sine', v = 0.2, slide = 0, delay = 0) {
  if (!AC) return; const t = AC.currentTime + delay; const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.03);
}
let nbuf = null;
function noise(d, v = 0.2, f = 1200, delay = 0, type = 'lowpass') {
  if (!AC) return; if (!nbuf) { nbuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const a = nbuf.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const t = AC.currentTime + delay, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = nbuf; fl.type = type; fl.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + d + 0.03);
}
const SFX = {
  kick() { tone(160, 0.12, 'triangle', 0.35, -90); noise(0.05, 0.15, 2500); },
  bump() { tone(300, 0.05, 'square', 0.06, -100); },
  dash() { noise(0.18, 0.12, 900, 0, 'bandpass'); },
  goal() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.25, 'square', 0.12, 0, i * 0.09)); noise(0.8, 0.12, 3000, 0.1); },
  boo() { tone(300, 0.5, 'sawtooth', 0.12, -180); },
  whistle() { tone(2200, 0.12, 'sine', 0.18); tone(2200, 0.35, 'sine', 0.18, 0, 0.16); },
  wave() { noise(1.6, 0.25, 600); },
  gull() { tone(1400, 0.15, 'sawtooth', 0.08, -500); tone(1300, 0.2, 'sawtooth', 0.08, -600, 0.18); },
  level() { [392, 523, 659, 784, 988].forEach((f, i) => tone(f, 0.3, 'triangle', 0.15, 0, i * 0.08)); },
  click() { tone(880, 0.06, 'square', 0.08); },
};
let musT = 0, musStep = 0;
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16];
function music(dt) {
  if (!AC || muted || state !== 'play') return; musT -= dt; if (musT > 0) return;
  const bpm = 112 + league * 6; musT += 60 / bpm / 2; const s = musStep++;
  const root = [196, 220, 174.6, 196][Math.floor(s / 16) % 4];
  if (s % 4 === 0) tone(root / 2, 0.22, 'triangle', 0.14);
  if (s % 2 === 1) noise(0.04, 0.04, 6000, 0, 'highpass');
  if (s % 8 === 4) noise(0.1, 0.08, 1500);
  if ((s * 7) % 3 !== 0) tone(root * Math.pow(2, SCALE[(s * 5 + Math.floor(s / 8)) % 8] / 12), 0.14, 'sine', 0.05);
}

// ---------- persistent run state ----------
let state = 'title', prevState = 'play';
let league = 0, matchNo = 0, lvl = 1, xp = 0, lives = 3, score = 0, goalsTotal = 0, wins = 0;
let upg = {};
let myNameStr = 'Crab' + Math.floor(Math.random() * 900 + 100);
try { myNameStr = localStorage.getItem('pincer-league-name') || myNameStr; } catch (e) {}
function shell() { let s = SHELLS[0]; for (const x of SHELLS) if (lvl >= x.l) s = x; return s; }
function xpNeed() { return 60 + lvl * 35; }

// ---------- match state ----------
let P, mates, opps, ball, rocks, kelp, sL, sR, timeLeft, freeze, freezeMsg, wave, waveT, gull, gullT, parts, shake, toasts, kickoffT, lastTouch;
function mkCrab(x, y, team, role, color) { return { x, y, vx: 0, vy: 0, r: 22, team, role, color, face: team === 0 ? 0 : Math.PI, walk: 0, kickCd: 0, snap: 0, dashT: 0, dashCd: 0, stun: 0, think: Math.random() }; }
function startMatch() {
  const L = LEAGUES[league];
  P = mkCrab(260, FH / 2, 0, 'player', shell().c); P.r = 22 + (upg.size || 0) * 4;
  mates = []; if (upg.buddy) mates.push(mkCrab(330, FH / 2 - 120, 0, 'mate', '#ffb27a'));
  opps = [];
  for (let i = 0; i < L.opp; i++) opps.push(mkCrab(700, FH / 2 + (i - (L.opp - 1) / 2) * 150, 1, 'field', L.oc));
  if (L.goalie) opps.push(mkCrab(955, FH / 2, 1, 'goalie', L.oc));
  ball = { x: FW / 2, y: FH / 2, vx: 0, vy: 0, r: 13, spin: 0 };
  rocks = []; kelp = [];
  const rng = mulberry(league * 1000 + matchNo * 17 + 3);
  for (let i = 0; i < L.rocks; i++) rocks.push({ x: 300 + rng() * 400, y: 80 + rng() * (FH - 160), r: 22 + rng() * 16 });
  rocks = rocks.filter(r => Math.hypot(r.x - FW / 2, r.y - FH / 2) > 90);
  for (let i = 0; i < L.kelp; i++) kelp.push({ x: 180 + rng() * 640, y: 60 + rng() * (FH - 120), r: 40 + rng() * 25, ph: rng() * 6 });
  sL = 0; sR = 0; timeLeft = MATCH_TIME; freeze = 1.6; freezeMsg = 'KICK OFF!'; kickoffT = 0;
  wave = null; waveT = 10 + Math.random() * 4; gull = null; gullT = 9 + Math.random() * 5; parts = []; shake = 0; toasts = toasts || []; lastTouch = null;
  buildField();
  SFX.whistle();
}
function resetPositions(scoredBy) {
  P.x = 260; P.y = FH / 2; P.vx = P.vy = 0;
  mates.forEach((m, i) => { m.x = 330; m.y = FH / 2 - 120; m.vx = m.vy = 0; });
  let i = 0; for (const o of opps) { o.vx = o.vy = 0; if (o.role === 'goalie') { o.x = 955; o.y = FH / 2; } else { o.x = 700; o.y = FH / 2 + (i - (opps.length - 2) / 2) * 150; i++; } }
  ball.x = scoredBy === 0 ? FW / 2 + 40 : FW / 2 - 40; ball.y = FH / 2; ball.vx = ball.vy = 0;
}
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// pre-rendered field
let fieldCv = document.createElement('canvas');
function buildField() {
  const L = LEAGUES[league], m = 60; fieldCv.width = FW + m * 2; fieldCv.height = FH + m * 2; const g = fieldCv.getContext('2d');
  g.fillStyle = L.water; g.fillRect(0, 0, fieldCv.width, fieldCv.height);
  const rng = mulberry(league * 31 + 7);
  // rim rocks
  for (let i = 0; i < 160; i++) { const t = rng(); let x, y; if (i % 2) { x = rng() * fieldCv.width; y = rng() < 0.5 ? rng() * m : fieldCv.height - rng() * m; } else { y = rng() * fieldCv.height; x = rng() < 0.5 ? rng() * m * 0.7 : fieldCv.width - rng() * m * 0.7; }
    g.fillStyle = L.night ? `hsl(225,20%,${18 + t * 14}%)` : `hsl(30,10%,${45 + t * 25}%)`; g.beginPath(); g.ellipse(x, y, 10 + rng() * 22, 8 + rng() * 14, rng() * 3, 0, 7); g.fill(); }
  g.save(); g.translate(m, m);
  const gr = g.createLinearGradient(0, 0, 0, FH); gr.addColorStop(0, L.sand[0]); gr.addColorStop(1, L.sand[1]);
  g.fillStyle = gr; roundRect(g, 0, 0, FW, FH, 40); g.fill();
  for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(${L.night ? '160,180,255' : '120,90,40'},${0.05 + rng() * 0.12})`; g.fillRect(rng() * FW, rng() * FH, 2, 2); }
  for (let i = 0; i < 18; i++) { const x = 40 + rng() * (FW - 80), y = 30 + rng() * (FH - 60); g.fillStyle = L.night ? '#7d8cff55' : '#ffffffaa'; drawShellDeco(g, x, y, 5 + rng() * 5, rng() * 6); }
  g.strokeStyle = L.night ? '#9fb0ff66' : '#ffffffaa'; g.lineWidth = 4; g.setLineDash([16, 12]);
  g.beginPath(); g.moveTo(FW / 2, 10); g.lineTo(FW / 2, FH - 10); g.stroke(); g.setLineDash([]);
  g.beginPath(); g.arc(FW / 2, FH / 2, 80, 0, 7); g.stroke();
  g.beginPath(); g.arc(0, FH / 2, 150, -1.2, 1.2); g.stroke(); g.beginPath(); g.arc(FW, FH / 2, 150, Math.PI - 1.2, Math.PI + 1.2); g.stroke();
  g.restore();
}
function drawShellDeco(g, x, y, r, a) { g.save(); g.translate(x, y); g.rotate(a); g.beginPath(); g.moveTo(0, r); for (let i = 0; i <= 6; i++) { const t = Math.PI + i / 6 * Math.PI; g.lineTo(Math.cos(t) * r, Math.sin(t) * r * 0.9 + r * 0.2); } g.closePath(); g.fill(); g.restore(); }
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

// ---------- input ----------
const keys = {};
let joy = { x: 0, y: 0, id: null }, mouseMove = null, kickPressed = false, dashPressed = false;
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.target && e.target.tagName === 'INPUT') { if (e.code === 'Enter') startGame(); return; }
  if (e.code === 'Space' || e.code === 'KeyJ' || e.code === 'KeyX') { kickPressed = true; e.preventDefault(); }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyK' || e.code === 'KeyZ') dashPressed = true;
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') toggleMute();
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
function toTouchMode() { document.body.classList.add('touch'); }
const stick = document.getElementById('stick'), knob = document.getElementById('knob');
stick.addEventListener('pointerdown', e => { toTouchMode(); joy.id = e.pointerId; stick.setPointerCapture(e.pointerId); joyMove(e); e.preventDefault(); });
stick.addEventListener('pointermove', e => { if (e.pointerId === joy.id) joyMove(e); });
const joyEnd = e => { if (e.pointerId === joy.id) { joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; } };
stick.addEventListener('pointerup', joyEnd); stick.addEventListener('pointercancel', joyEnd);
function joyMove(e) { const r = stick.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const d = Math.hypot(dx, dy), mx = 48; if (d > mx) { dx *= mx / d; dy *= mx / d; } joy.x = dx / mx; joy.y = dy / mx; knob.style.transform = `translate(${dx}px,${dy}px)`; }
document.getElementById('bKick').addEventListener('pointerdown', e => { toTouchMode(); kickPressed = true; e.preventDefault(); });
document.getElementById('bDash').addEventListener('pointerdown', e => { toTouchMode(); dashPressed = true; e.preventDefault(); });
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') { toTouchMode(); return; }
  if (e.button === 2) { kickPressed = true; return; }
  if (e.button === 1) { dashPressed = true; return; }
  mouseMove = { x: e.clientX, y: e.clientY };
});
cv.addEventListener('pointermove', e => { if (mouseMove && e.pointerType !== 'touch') { mouseMove.x = e.clientX; mouseMove.y = e.clientY; } });
addEventListener('pointerup', e => { if (e.pointerType !== 'touch' && e.button === 0) mouseMove = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('dblclick', () => { dashPressed = true; });
document.getElementById('bPause').addEventListener('click', () => togglePause());
document.getElementById('bMute').addEventListener('click', () => toggleMute());
function toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.45; document.getElementById('bMute').textContent = muted ? '🔇' : '♪'; }

// ---------- view transform ----------
let V = { s: 1, cx: 0, cy: 0, port: false };

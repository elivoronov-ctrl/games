<script>
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');
let W = innerWidth, H = innerHeight, DPR = 1, SC = 1, VW = 800, VH = 540;
const coarse = matchMedia('(pointer:coarse)').matches;
let touchUI = coarse;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ================= LEVELS =================
const DISTRICTS = [
  { name: 'Lantern Row', sky: ['#1a1040', '#5a2a5a'], hue: 330, speed: 280, gap: [60, 130], w: [380, 700], dy: 30, feats: [], tip: 'Run the rooftops! Jump the gaps and slash paper lanterns for points.' },
  { name: 'Loose Tiles', sky: ['#14183a', '#4a3a6a'], hue: 260, speed: 300, gap: [70, 150], w: [320, 640], dy: 45, feats: ['crumble'], tip: 'NEW: cracked roofs crumble a moment after you land. Keep moving!' },
  { name: 'Crow Roost', sky: ['#0e1a30', '#3a4a6a'], hue: 210, speed: 320, gap: [80, 160], w: [300, 600], dy: 50, feats: ['crumble', 'crow'], tip: 'NEW: crows swoop at you. Slash them out of the sky or jump clear.' },
  { name: 'Ninja Watch', sky: ['#1a0e2a', '#5a2a3a'], hue: 350, speed: 335, gap: [80, 170], w: [300, 600], dy: 55, feats: ['crumble', 'crow', 'ninja'], tip: 'NEW: rooftop ninjas block the way. Slash first, or leap over them.' },
  { name: 'Bamboo Scaffold', sky: ['#0a1e1a', '#2a5a4a'], hue: 150, speed: 350, gap: [100, 190], w: [200, 420], dy: 60, feats: ['crumble', 'crow', 'ninja'], tip: 'NEW: narrow scaffolds and wide gaps. Hold jump for height and use your double jump.' },
  { name: 'Archer Towers', sky: ['#200a10', '#6a2a2a'], hue: 10, speed: 365, gap: [90, 180], w: [280, 560], dy: 55, feats: ['crow', 'ninja', 'arrow'], tip: 'NEW: archers fire from the towers ahead. Watch for the red warning, then jump or slash the arrow.' },
  { name: 'Festival Night', sky: ['#1a0830', '#6a2a6a'], hue: 290, speed: 380, gap: [90, 190], w: [280, 560], dy: 60, feats: ['crumble', 'ninja', 'arrow', 'firework'], tip: 'NEW: festival fireworks launch from marked roofs. Do not be standing on one when it blows!' },
  { name: 'Thunder Rain', sky: ['#0a0e18', '#2a3448'], hue: 220, speed: 395, gap: [100, 200], w: [260, 520], dy: 60, feats: ['crumble', 'crow', 'arrow', 'lightning'], rain: true, tip: 'NEW: lightning strikes the glowing marks. The storm is loud, so stay sharp.' },
  { name: 'Castle Walls', sky: ['#100818', '#40203a'], hue: 320, speed: 415, gap: [100, 210], w: [240, 520], dy: 65, feats: ['crumble', 'crow', 'ninja', 'arrow', 'shuriken', 'firework'], tip: 'NEW: elite ninjas throw shuriken. Everything is faster now.' },
  { name: "Shogun's Keep", sky: ['#200408', '#801818'], hue: 0, speed: 440, gap: [110, 220], w: [240, 500], dy: 70, feats: ['crumble', 'crow', 'ninja', 'arrow', 'shuriken', 'firework', 'lightning'], rain: true, tip: 'FINAL RUN: every danger at once. Reach the keep and ring the great bell!' },
];
const LEN = n => 8200 + n * 900;
let LV = null;
function genLevel(n) {
  const D = DISTRICTS[n], rng = mulberry(9001 + n * 131), R = (a, b) => a + rng() * (b - a), has = f => D.feats.includes(f);
  const segs = [], objs = []; let x = 900, y = 380, nl = 0;
  segs.push({ x: -600, w: 1500, y: 380, crumble: false });
  const len = LEN(n);
  while (x < len) {
    const gap = R(D.gap[0], D.gap[1]); const ny = clamp(y + R(-D.dy, D.dy), 300, 440); const climb = y - ny;
    const g2 = climb > 20 ? gap * 0.8 : gap; const sx = x + g2;
    // coins arc over the gap
    for (let k = 1; k <= 3; k++) objs.push({ t: 'coin', x: x + g2 * k / 4, y: Math.min(y, ny) - 70 - Math.sin(k / 4 * Math.PI) * 50 });
    const w = R(D.w[0], D.w[1]); y = ny;
    const seg = { x: sx, w, y, crumble: has('crumble') && rng() < 0.22 && w < 520 };
    if (seg.crumble) seg.w = Math.min(w, 300);
    segs.push(seg);
    // lanterns
    const lc = 1 + (rng() * 2 | 0); for (let k = 0; k < lc; k++) { objs.push({ t: 'lantern', x: sx + R(60, seg.w - 40), y: y - R(85, 160), col: rng() < 0.5 ? '#ff5a4a' : '#ffb84a' }); nl++; }
    const mid = sx + seg.w * R(0.45, 0.75);
    const pick = rng();
    if (has('ninja') && !seg.crumble && seg.w > 260 && pick < 0.35) objs.push({ t: has('shuriken') && rng() < 0.5 ? 'ninja2' : 'ninja', x: mid, y, hp: 1, thrown: false });
    else if (has('firework') && !seg.crumble && seg.w > 280 && pick < 0.55) objs.push({ t: 'firework', x: mid, y, st: 0, tm: 0 });
    else if (has('lightning') && seg.w > 260 && pick < 0.75) objs.push({ t: 'bolt', x: mid, y, st: 0, tm: 0 });
    if (has('crow') && rng() < 0.4) objs.push({ t: 'crow', x: sx + seg.w + R(100, 400), y: y - R(110, 200), trig: false, base: 0, ph: rng() * 6 });
    if (has('arrow') && rng() < 0.35) objs.push({ t: 'arrowTrig', x: sx + R(0, seg.w), done: false });
    x = sx + seg.w;
  }
  const finalX = x + R(D.gap[0], D.gap[1]);
  segs.push({ x: finalX, w: 1600, y: 380, crumble: false, final: true });
  return { n, D, segs, objs, nl, goal: finalX + 500, projs: [] };
}

// ================= STATE =================
const SKEY = 'kawaradash_v1';
let best = 0, unlocked = 0, myName = '';
try { best = +localStorage.getItem(SKEY + '_best') || 0; unlocked = +localStorage.getItem(SKEY + '_lvl') || 0; myName = localStorage.getItem(SKEY + '_name') || ''; } catch (e) {}
function persist() { try { localStorage.setItem(SKEY + '_best', String(best)); localStorage.setItem(SKEY + '_lvl', String(unlocked)); localStorage.setItem(SKEY + '_name', myName); } catch (e) {} }
const G = { state: 'title', lvl: 0, score: 0, lvlScore: 0, hearts: 3, hits: 0, cut: 0, time: 0, shake: 0, flash: 0, stars: [] };
const P = { x: 0, y: 380, vy: 0, onGround: true, jumps: 0, slash: 0, slashCd: 0, inv: 0, run: 0, hold: false, drop: false, dead: false, seg: null };
let particles = [], popups = [], petals = [], AUTO = false;
let camX = 0, camY = 0;

// ================= AUDIO =================
let AC = null, master = null, muted = false, musT = null, beat = 0;
const PENTA = [220, 261.6, 293.7, 349.2, 392, 440, 523.3, 587.3];
function initAudio() { if (AC) return; try { AC = new AudioContext(); master = AC.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(AC.destination); } catch (e) { AC = null; } }
function tone(f, dur, type = 'square', vol = 0.1, slide = 0, delay = 0) {
  if (!AC || muted) return; const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq, type = 'bandpass', delay = 0) {
  if (!AC || muted) return; const t = AC.currentTime + delay, n = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = b; const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
function shamisen(f, vol = 0.07, delay = 0) { if (!AC || muted) return; const t = AC.currentTime + delay, o = AC.createOscillator(), fl = AC.createBiquadFilter(), g = AC.createGain(); o.type = 'sawtooth'; o.frequency.value = f; fl.type = 'bandpass'; fl.frequency.value = f * 3; fl.Q.value = 2; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35); o.connect(fl); fl.connect(g); g.connect(master); o.start(t); o.stop(t + 0.4); }

const SFX = {
  jump() { tone(300, 0.12, 'square', 0.06, 300); }, djump() { tone(450, 0.14, 'triangle', 0.08, 500); },
  slash() { noise(0.14, 0.25, 4000, 'highpass'); tone(1200, 0.08, 'sawtooth', 0.03, -800); },
  cut() { noise(0.2, 0.2, 1500); tone(880, 0.15, 'triangle', 0.08, 0, 0.03); }, coin() { tone(1320, 0.07, 'square', 0.05); tone(1760, 0.1, 'square', 0.05, 0, 0.05); },
  kill() { noise(0.18, 0.3, 800); tone(200, 0.2, 'sawtooth', 0.1, -120); }, hit() { taiko(0.5); noise(0.3, 0.3, 300, 'lowpass'); tone(160, 0.3, 'square', 0.1, -100); },
  caw() { tone(700, 0.18, 'sawtooth', 0.06, -300); tone(650, 0.15, 'sawtooth', 0.05, -300, 0.2); }, warn() { tone(1000, 0.06, 'square', 0.05); tone(1000, 0.06, 'square', 0.05, 0, 0.1); },
  boom() { noise(0.6, 0.35, 600, 'lowpass'); noise(0.4, 0.15, 3000, 'bandpass', 0.1); }, thunder() { noise(0.9, 0.4, 400, 'lowpass'); noise(0.2, 0.3, 3000, 'highpass'); },
  clang() { tone(600, 0.15, 'square', 0.06); noise(0.1, 0.15, 5000, 'highpass'); }, crumble() { noise(0.4, 0.2, 500, 'lowpass'); },
  clear() { [0, 2, 4, 5, 7].forEach((k, i) => shamisen(PENTA[k] * 2, 0.12, i * 0.1)); [0, 0.4].forEach(d => taiko(0.4, d)); }, over() { [7, 5, 3, 0].forEach((k, i) => shamisen(PENTA[k], 0.1, i * 0.2)); taiko(0.5, 0.8); },
  bell() { [1, 2.76, 5.4].forEach((m, i) => tone(196 * m, 2.4 - i * 0.6, 'sine', 0.12 / (i + 1))); },
};
const MEL = [0, 2, 3, 4, 3, 2, 0, -1, 4, 5, 7, 5, 4, 3, 2, -1];
function music(on) { clearInterval(musT); musT = null; if (!on) return; const bpmMs = 60000 / (130 + G.lvl * 4) / 2;
  musT = setInterval(() => { if (!AC || muted || G.state !== 'play') return; const b = beat++ % 16; if (b % 4 === 0) taiko(0.22); if (b % 8 === 6) taiko(0.12); if (b % 2 === 1) noise(0.03, 0.05, 6000, 'highpass');
    const m = MEL[(b + (beat >> 5) * 3) % 16]; if (m >= 0 && b % 2 === 0) shamisen(PENTA[m] * (b % 8 === 0 ? 1 : 2), 0.05); }, bpmMs); }
function setMute(m) { muted = m; if (master) master.gain.value = m ? 0 : 0.5; $('#bMute').textContent = m ? '🔇' : '♪'; }

// ================= MULTIPLAYER =================
const SB_URL = 'https://fxaudfluqfkplnjyqylv.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4YXVkZmx1cWZrcGxuanlxeWx2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2NjczNTIsImV4cCI6MjEwOTI0MzM1Mn0.IzD6AGIz5NHnoeWGpQP28IySiugtvQL-WZZLqwNa_xI';
const ROOM = 'kawara-dash-room';
const myId = Math.random().toString(36).slice(2, 10);
const NET = { connected: false, online: 1, remotes: {}, retry: 0, presence: [], tried: false };
let client = null, chan = null, sendT = 0, presT = 0;
const COLS = ['#5ab0ff', '#7cf27c', '#ffcf5a', '#c88aff', '#ff8ad0', '#5affe0'];

function connect() {

    chan.on('broadcast', { event: 'm' }, ({ payload }) => onMsg(payload));
    chan.on('presence', { event: 'sync' }, () => { const st = chan.presenceState(); const list = []; for (const k in st) { const p = st[k][0]; if (p) list.push({ id: k, ...p }); }
      NET.presence = list; NET.online = Math.max(1, list.length); for (const id in NET.remotes) if (!st[id]) delete NET.remotes[id]; });

let lastTrack = 0, trackPend = null;

  if (!chan || !NET.connected) return;

  if (wait > 0) { if (!trackPend) trackPend = setTimeout(() => { trackPend = null; trackPresence(); }, wait); return; }

}
function send(p) { if (chan && NET.connected) chan.send({ type: 'broadcast', event: 'm', payload: { id: myId, ...p } }).catch(() => {}); }

const GRAV = 2300, JV = 760, DJV = 680;

}
function doSlash() { if (G.state !== 'play' || P.slashCd > 0) return; P.slash = 0.22; P.slashCd = 0.3; SFX.slash(); }

  P.vy = -500; P.onGround = false; P.jumps = 1; toast(src, 1);
  if (G.hearts <= 0) { G.state = 'dying'; setTimeout(gameOver, 900); }
}
function fallOut() {
  G.hearts--; G.hits++; SFX.hit(); G.shake = 0.4; G.flash = 0.3;
  if (G.hearts <= 0) { G.state = 'dying'; P.dead = true; setTimeout(gameOver, 700); return; }

  let s = null; for (const q of LV.segs) if (!q.fallen && !q.crumble && q.x + q.w > P.x + 40) { s = q; break; }
  if (!s) s = LV.segs[LV.segs.length - 1];
  P.x = Math.max(s.x + 40, Math.min(P.x + 40, s.x + s.w - 80)); P.y = s.y - 120; P.vy = 0; P.inv = 1.6; P.jumps = 1; toast('Fell! ♥ -1', 1); burst(P.x, P.y, 30, '#ffffff', 200, 100);
}
function update(dt) {
  G.time += dt; const D = LV.D;
  P.inv -= dt; P.slash -= dt; P.slashCd -= dt;
  const spd = D.speed * (G.state === 'play' ? 1 : 0);
  const oy = P.y;
  P.x += spd * dt;
  // gravity w/ variable jump
  let g = GRAV; if (P.vy < 0 && !P.hold) g *= 1.9; if (P.drop && !P.onGround) g *= 2.6;
  P.vy += g * dt; P.y += P.vy * dt;
  // ground
  const s = segAt(P.x);
  P.onGround = false;
  if (s && P.vy >= 0 && oy <= s.y + 4 && P.y >= s.y) { P.y = s.y; P.vy = 0; P.onGround = true; P.jumps = 0;
    if (s.crumble && !s.touched) { s.touched = G.time; SFX.crumble(); } }
  else if (s && P.y > s.y + 4 && oy > s.y + 4) { // ran into a wall face: stay in the gap and fall
    P.x = s.x - 1; }
  if (P.onGround) P.coy = 0.1; else P.coy = (P.coy || 0) - dt;
  if (AUTO) { const ahead = segAt(P.x + D.speed * 0.2); if (P.onGround && (!ahead || ahead.y < P.y - 20)) { P.hold = true; doJump(); } else if (!P.onGround && P.vy > 0 && P.jumps < 2 && !segAt(P.x + 60) && P.y > (ahead ? ahead.y : 380) - 10) doJump();
    if (P.slashCd <= 0 && LV.objs.some(o => !o.gone && (o.t === 'lantern' || o.t === 'ninja' || o.t === 'ninja2' || o.t === 'crow') && o.x - P.x > 0 && o.x - P.x < 90 && Math.abs(o.y - P.y) < 150)) doSlash(); }

  // crumbling roofs
  for (const q of LV.segs) if (q.crumble && q.touched && !q.fallen) { if (G.time - q.touched > 0.55) { q.fallen = G.time; burst(q.x + q.w / 2, q.y, 30, '#5a4a6a', 300, 50); } }

  const px0 = P.x - 14, px1 = P.x + 14, py0 = P.y - 56, py1 = P.y;

  const inBody = (x, y, r = 10) => x + r > px0 && x - r < px1 && y + r > py0 && y - r < py1;
  for (const o of LV.objs) {
    if (o.gone) continue;
    if (o.x < camX - 200 || o.x > camX + VW + 700) continue;
    switch (o.t) {
      case 'coin': if (inBody(o.x, o.y, 12)) { o.gone = 1; addScore(10); SFX.coin(); burst(o.x, o.y, 6, '#ffcf5a', 100, 50, 300, 0.4); } break;
      case 'lantern': if (inSlash(o.x, o.y + 10, 18)) { o.gone = 1; G.cut++; addScore(50, o.x, o.y); SFX.cut(); burst(o.x, o.y, 22, o.col, 260, 100); burst(o.x, o.y, 8, '#fff2c0', 120, 50); }
        else if (inBody(o.x, o.y + 10, 14)) { o.gone = 1; G.cut++; addScore(25, o.x, o.y); SFX.cut(); burst(o.x, o.y, 14, o.col, 200, 80); } break;
      case 'ninja': case 'ninja2':
        if (o.t === 'ninja2' && !o.thrown && o.x - P.x < 520 && o.x > P.x) { o.thrown = true; LV.projs.push({ t: 'star', x: o.x - 20, y: o.y - 34, vx: -420, vy: (P.y - 30 - (o.y - 34)) * 0.6, rot: 0 }); SFX.clang(); }
        if (inSlash(o.x, o.y - 28, 18)) { o.gone = 1; addScore(100, o.x, o.y - 60); SFX.kill(); burst(o.x, o.y - 28, 26, '#20202a', 260, 120); burst(o.x, o.y - 28, 10, '#ff5a4a', 200, 100); G.shake = 0.15; }
        else if (inBody(o.x, o.y - 28, 14)) hurt('Ninja!'); break;

        if (o.trig) { o.x -= 180 * dt; o.ph += dt * 4; o.y = o.base + Math.sin(o.ph) * 40 + Math.max(0, (o.x - P.x) < 300 ? (P.y - 40 - o.base) * 0.4 : 0); }
        if (inSlash(o.x, o.y, 16)) { o.gone = 1; addScore(80, o.x, o.y); SFX.kill(); burst(o.x, o.y, 20, '#1a1a2a', 220, 60); }
        else if (inBody(o.x, o.y, 12)) hurt('Crow!'); break;
      case 'arrowTrig': if (!o.done && P.x > o.x) { o.done = true; const ay = P.y - 26 - Math.random() * 30; LV.projs.push({ t: 'arrow', x: camX + VW + 300, y: ay, vx: -560, vy: 0, warn: 0.75 }); SFX.warn(); } break;
      case 'firework': case 'bolt': {

        else if (o.st === 1) { o.tm -= dt; if (o.tm <= 0) { o.st = 2; o.tm = 0.45; if (o.t === 'bolt') { SFX.thunder(); G.flash = 0.5; } else SFX.boom(); G.shake = 0.25;
          burst(o.x, o.y - 120, 40, o.t === 'bolt' ? '#cfe6ff' : ['#ff5a8a', '#ffd25a', '#5affc0'][Math.random() * 3 | 0], 320, 200, 300, 1); } }
        else if (o.st === 2) { o.tm -= dt; if (Math.abs(P.x - o.x) < 34 && P.y > o.y - 260) hurt(o.t === 'bolt' ? 'Lightning!' : 'Firework!'); if (o.tm <= 0) o.st = 3; }

    if (inSlash(pr.x, pr.y, 14)) { pr.gone = 1; addScore(40, pr.x, pr.y); SFX.clang(); burst(pr.x, pr.y, 14, '#ffffff', 260, 40, 300, 0.4); }
    else if (inBody(pr.x, pr.y, 8)) { pr.gone = 1; hurt(pr.t === 'star' ? 'Shuriken!' : 'Arrow!'); }
    if (pr.x < camX - 100) pr.gone = 1;
  }

  if (P.onGround && Math.random() < dt * 20) particles.push({ x: P.x - 8, y: P.y, vx: -60 - Math.random() * 60, vy: -30 - Math.random() * 40, g: 100, life: 0.35, max: 0.35, col: 'rgba(200,190,230,.6)', r: 2 + Math.random() * 2 });

}

// ================= DRAW =================
function resize() { DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); SC = Math.min(H / 540, W / 760); VW = W / SC; VH = H / SC; }
addEventListener('resize', resize);
const stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random() * 0.6, s: Math.random() * 1.6 + 0.3, p: Math.random() * 6 }));
for (let i = 0; i < 26; i++) petals.push({ x: Math.random(), y: Math.random(), s: 0.5 + Math.random(), p: Math.random() * 6 });
function drawSky(t) {
  const D = (LV || genLevel(0)).D; const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, D.sky[0]); g.addColorStop(1, D.sky[1]); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of stars) { ctx.globalAlpha = 0.4 + 0.4 * Math.sin(t * 2 + s.p); ctx.fillStyle = '#fff'; ctx.fillRect(s.x * W, s.y * H, s.s, s.s); } ctx.globalAlpha = 1;

  const mg = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 3); mg.addColorStop(0, 'rgba(255,240,210,.35)'); mg.addColorStop(1, 'rgba(255,240,210,0)'); ctx.fillStyle = mg; ctx.fillRect(mx - mr * 3, my - mr * 3, mr * 6, mr * 6);
  ctx.fillStyle = D.n === 9 || G.lvl === 9 ? '#ffb090' : '#fff2d8'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, 7); ctx.fill();

  const layer = (par, base, amp, col, seed) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H); const off = camX * par;
    for (let x = 0; x <= W + 40; x += 40) { const wx = (x / SC + off) * 0.01 + seed; ctx.lineTo(x, (base + Math.sin(wx) * amp + Math.sin(wx * 2.3 + seed) * amp * 0.4 - (camY * par * 0.5)) * SC + (H - VH * SC) / 2); }
    ctx.lineTo(W, H); ctx.fill(); };
  layer(0.08, 330, 40, 'rgba(20,10,40,.55)', 1);
  // pagodas
  ctx.fillStyle = 'rgba(15,8,30,.75)'; const off = camX * 0.18;
  for (let i = -1; i < VW / 420 + 2; i++) { const wx = Math.floor(off / 420) + i, bx = (wx * 420 - off) * SC, h = (90 + (wx * 37 % 5 + 5) % 5 * 22) * SC, by = (430 - camY * 0.1) * SC;
    for (let k = 0; k < 3; k++) { const ww = (70 - k * 16) * SC, yy = by - h * (k + 1) / 3; ctx.fillRect(bx - ww * 0.35, yy, ww * 0.7, h / 3); ctx.beginPath(); ctx.moveTo(bx - ww * 0.7, yy + 6 * SC); ctx.quadraticCurveTo(bx, yy - 14 * SC, bx + ww * 0.7, yy + 6 * SC); ctx.fill(); }
    ctx.fillRect(bx - 2 * SC, by - h - 20 * SC, 4 * SC, 22 * SC); ctx.fillStyle = 'rgba(255,170,90,.25)'; ctx.fillRect(bx - 4 * SC, by - h * 0.5, 8 * SC, 6 * SC); ctx.fillStyle = 'rgba(15,8,30,.75)'; }
  layer(0.35, 470, 25, 'rgba(10,5,20,.8)', 4);
}
const wx = x => (x - camX) * SC, wy = y => (y - camY) * SC;
function drawRoof(s, t) {
  let dy = 0; if (s.fallen) dy = (G.time - s.fallen) ** 2 * 900; else if (s.crumble && s.touched) dy = Math.sin(t * 60) * 2;
  const x = wx(s.x), y = wy(s.y + dy), w = s.w * SC, bot = H + 10;
  if (x > W + 40 || x + w < -40 || y > H + 50) return;
  // building

function drawSamurai(x, y, run, slash, alpha, col, air, name) {

function drawObjs(t) {
  for (const o of LV.objs) {
    if (o.gone || o.x < camX - 100 || o.x > camX + VW + 100) continue;
    const x = wx(o.x), y = wy(o.y);
    if (o.t === 'coin') { ctx.fillStyle = '#ffcf5a'; ctx.beginPath(); ctx.ellipse(x, y, 7 * SC * Math.abs(Math.cos(t * 4 + o.x)), 9 * SC, 0, 0, 7); ctx.fill(); }
    else if (o.t === 'lantern') { const sw = Math.sin(t * 2 + o.x) * 0.15; ctx.save(); ctx.translate(x, y); ctx.rotate(sw);
      ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, -12 * SC); ctx.lineTo(0, -80 * SC); ctx.stroke();
      const gl = ctx.createRadialGradient(0, 10 * SC, 2, 0, 10 * SC, 40 * SC); gl.addColorStop(0, 'rgba(255,180,90,.45)'); gl.addColorStop(1, 'rgba(255,180,90,0)'); ctx.fillStyle = gl; ctx.fillRect(-40 * SC, -30 * SC, 80 * SC, 80 * SC);
      ctx.fillStyle = o.col; ctx.beginPath(); ctx.ellipse(0, 10 * SC, 13 * SC, 17 * SC, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#2a1410'; ctx.fillRect(-7 * SC, -9 * SC, 14 * SC, 4 * SC); ctx.fillRect(-7 * SC, 25 * SC, 14 * SC, 4 * SC);
      ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); for (let k = -1; k <= 1; k++) { ctx.moveTo(-13 * SC, (10 + k * 8) * SC); ctx.lineTo(13 * SC, (10 + k * 8) * SC); } ctx.stroke(); ctx.restore(); }

      ctx.fillStyle = o.t === 'ninja2' ? '#3a1030' : '#16141e'; ctx.fillRect(-10, -44 + b, 20, 28); ctx.beginPath(); ctx.arc(0, -50 + b, 9, 0, 7); ctx.fill(); ctx.fillRect(-9, -16, 6, 16); ctx.fillRect(3, -16, 6, 16);
      ctx.fillStyle = '#ffdcb8'; ctx.fillRect(-6, -53 + b, 12, 4); ctx.fillStyle = '#ff3030'; ctx.fillRect(-4, -52 + b, 2, 2); ctx.fillRect(2, -52 + b, 2, 2);
      ctx.strokeStyle = '#ccd'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(10, -30 + b); ctx.lineTo(30, -50 + b); ctx.stroke(); ctx.restore(); }

      ctx.fillStyle = '#ffcf5a'; ctx.beginPath(); ctx.moveTo(13, -2); ctx.lineTo(20, 0); ctx.lineTo(13, 2); ctx.fill(); ctx.fillStyle = '#ff3030'; ctx.fillRect(8, -4, 2, 2); ctx.restore(); }

}
function drawRain(t) { if (!LV.D.rain) return; ctx.strokeStyle = 'rgba(180,200,255,.35)'; ctx.lineWidth = 1; ctx.beginPath(); for (let i = 0; i < 120; i++) { const x = ((i * 97.3 + t * 300 - camX * 0.6) % W + W) % W, y = ((i * 53.1 + t * 900) % H); ctx.moveTo(x, y); ctx.lineTo(x - 6, y + 18); } ctx.stroke(); }
function drawHUD() {
  ctx.save(); ctx.translate(SAFE.l, SAFE.t); const w = W - SAFE.l - SAFE.r;
  ctx.fillStyle = 'rgba(15,6,25,.65)'; ctx.fillRect(10, 10, Math.min(260, w - 130), 62); ctx.strokeStyle = 'rgba(232,64,58,.6)'; ctx.strokeRect(10.5, 10.5, Math.min(260, w - 130), 62);

  ctx.fillStyle = '#ff5a4a'; ctx.font = '16px Trebuchet MS'; ctx.fillText('♥'.repeat(Math.max(0, G.hearts)) + '♡'.repeat(Math.max(0, 3 - G.hearts)), 110, 48);
  ctx.font = '12px Trebuchet MS'; ctx.fillStyle = NET.connected ? '#7cf27c' : '#c8b8e0'; ctx.fillText(NET.connected ? `● ${NET.online} online` : '○ Offline: solo', 20, 66);

function drawWorld(t, dt) {

// ================= INPUT =================
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') { if (e.code === 'Enter') { const b = card.querySelector('#go'); if (b) b.click(); } return; }
  if (e.repeat) { if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault(); return; }
  if (['Space', 'KeyW', 'ArrowUp'].includes(e.code)) { e.preventDefault(); P.hold = true; doJump(); }
  if (['KeyJ', 'KeyX', 'Enter', 'KeyK'].includes(e.code)) { e.preventDefault(); doSlash(); }
  if (['KeyS', 'ArrowDown'].includes(e.code)) { e.preventDefault(); P.drop = true; }
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') setMute(!muted);
});
addEventListener('keyup', e => { if (['Space', 'KeyW', 'ArrowUp'].includes(e.code)) P.hold = false; if (['KeyS', 'ArrowDown'].includes(e.code)) P.drop = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' && !touchUI) { touchUI = true; if (G.state === 'play') setPlayUI(true); }
  if (G.state !== 'play') return;
  if (e.pointerType === 'mouse') { if (e.button === 2) doSlash(); else { P.hold = true; doJump(); } }
  else { if (e.clientX < W / 2) { P.hold = true; doJump(); } else doSlash(); }

addEventListener('pointerup', () => { P.hold = false; });
const btn = (id, down, up) => { const el = $(id); el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); initAudio(); down(); }); if (up) { el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('pointerleave', up); } };
btn('#bJump', () => { P.hold = true; doJump(); }, () => { P.hold = false; });
btn('#bSlash', () => doSlash());
btn('#bDrop', () => { P.drop = true; }, () => { P.drop = false; });
$('#bPause').addEventListener('click', () => togglePause()); $('#bMute').addEventListener('click', () => setMute(!muted));

// ================= LOOP =================
let last = performance.now(), T = 0, FR = 0;
function frame(now) {
  requestAnimationFrame(frame); FR++;
  const dt = Math.min(0.04, (now - last) / 1000); last = now; T += dt;
  if (G.state === 'play') update(dt);
  else if (G.state === 'dying') { P.vy += GRAV * dt; P.y += P.vy * dt * 0.5; }
  else if (G.state === 'title') { P.x += 220 * dt; if (P.x > LV.goal - 400) P.x = 300; const s = segAt(P.x + 140); if (s && s.y < P.y - 5 && P.onGround) { P.vy = -JV; P.onGround = false; } const sg = segAt(P.x);

  updateRemotes(dt);
  // camera

  ctx.save(); if (G.shake > 0) { ctx.translate((Math.random() - 0.5) * G.shake * 30, (Math.random() - 0.5) * G.shake * 30); G.shake = Math.max(0, G.shake - dt); }
  drawWorld(T, dt); ctx.restore();
  if (G.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${G.flash * 0.6})`; ctx.fillRect(0, 0, W, H); G.flash -= dt; }
  if (toastT > 0) toastT -= dt;
  if (G.state === 'play' || G.state === 'paused' || G.state === 'dying') drawHUD();
}
resize(); titleScreen(); requestAnimationFrame(frame);

window.__kd = {
  get state() { return G.state; }, get level() { return G.lvl; }, get x() { return P.x; }, get y() { return P.y; }, get hearts() { return G.hearts; }, get score() { return G.score; }, get frames() { return FR; },
  get connected() { return NET.connected; }, get online() { return NET.online; }, remotes: () => Object.values(NET.remotes).map(r => r.name),

  finish() { P.x = LV.goal - 5; const s = segAt(P.x); if (s) P.y = s.y; }, god(v) { P.inv = v ? 1e9 : 0; }, auto(v) { AUTO = !!v; }, hurt() { P.inv = 0; hurt('Test'); },
};

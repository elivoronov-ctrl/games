      if (bd) { tx = bd.x; tz = bd.z; speed = 2.2; if (bestD < 0.06) { p.eatT -= dt; speed = 0; if (p.eatT <= 0) { p.eatT = 0.6; bd.alive = false; G.eatenVal += bd.v; setDirtMatrix(bd); dirtMesh.instanceMatrix.needsUpdate = true; } } } }
    if (dist < p.r + 0.55 && p.scared <= 0) { p.scared = 3; G.credits += 5; G.score += 5; G.earned += 5; SFX.squeak(); toast('Eek! ◆+5', 0.8); burst(p.x, 0.3, p.z, 10, 0xffa0b0, 2, 2); }
  } else if (p.t === 'rc') {
    if (p.vx === 0 && p.vz === 0) { const a = Math.random() * 6.28; p.vx = Math.cos(a); p.vz = Math.sin(a); }
    const sp = 4.2 + lvl * 0.2, m = Math.hypot(p.vx, p.vz) || 1; p.vx = p.vx / m * sp; p.vz = p.vz / m * sp;
    if (p.tm < 0) { p.tm = rnd(1.5, 3); const a = Math.atan2(p.vz, p.vx) + rnd(-1, 1); p.vx = Math.cos(a) * sp; p.vz = Math.sin(a) * sp; }
  }
  if (p.t !== 'rc' && !(p.t === 'cat' && p.st === 'pounce')) {
    const ddx = tx - p.x, ddz = tz - p.z, dd = Math.hypot(ddx, ddz);
    const tvx = dd > 0.05 ? ddx / dd * speed : 0, tvz = dd > 0.05 ? ddz / dd * speed : 0;
    p.vx += (tvx - p.vx) * Math.min(1, 6 * dt); p.vz += (tvz - p.vz) * Math.min(1, 6 * dt);
  }
  p.x += p.vx * dt; p.z += p.vz * dt;
  const hit = collideCircle(p, p.r);
  if (hit) { if (p.t === 'rc') { if (hit === 'x') p.vx *= -1; else p.vz *= -1; } else if (p.st === 'pounce') { p.st = 'rest'; p.tm = 1.5; } else if (p.t !== 'mouse') pickWander(); }
  if (Math.hypot(p.vx, p.vz) > 0.3) p.ang = Math.atan2(-p.vx, -p.vz);
  // hit player
  if ((p.t === 'cat' || p.t === 'rc') && dist < p.r + 0.5 && p.cd <= 0) {
    if (P.turbo > 0) { p.cd = 1.5; p.scared = 2.5; p.vx = -dx / (dist || 1) * 7; p.vz = -dz / (dist || 1) * 7; if (p.t === 'cat') { p.st = 'wander'; SFX.meow(); } G.credits += 3; G.score += 3; G.earned += 3; toast('TURBO BUMP! ◆+3', 0.8); burst(p.x, 0.4, p.z, 18, 0x7cf2d0, 3, 3); G.shake = 0.2; }
    else if (P.stun <= 0) { p.cd = 1.5; stunPlayer(p.x, p.z, 7, p.t === 'cat' ? 'Pounced!' : 'Bonk!'); if (p.t === 'cat') { p.st = 'rest'; p.tm = 1.8; } else { p.vx = -p.vx; p.vz = -p.vz; } }
  }
  p.m.position.set(p.x, 0, p.z); p.m.rotation.y = p.ang;
  const tail = p.m.getObjectByName('tail'); if (tail) tail.rotation.z = Math.sin(G.time * (p.t === 'dog' ? 14 : 4)) * 0.6;
  if (p.t === 'mouse' || p.t === 'dog') p.m.position.y = Math.abs(Math.sin(G.time * 18)) * 0.03 * Math.min(1, Math.hypot(p.vx, p.vz));
}

// ---------- render ----------
function sync(dt) {
  bot.position.set(P.x, P.stun > 0 ? Math.abs(Math.sin(G.time * 30)) * 0.05 : 0, P.z); bot.rotation.y = P.ang;
  brush.rotation.y += dt * (P.jam > 0 ? 2 : 25);
  const bf = P.bat / P.batMax; botLed.material.color.setHSL(bf * 0.33, 1, 0.55);
  botTop.material.emissive = new THREE.Color(P.turbo > 0 ? 0x30a080 : 0x000000);
  if (dockMesh) { const b = dockMesh.getObjectByName('bolt'); if (b) { b.rotation.y += dt * 2; b.position.y = 0.9 + Math.sin(G.time * 3) * 0.1; }
    dockRing.material.opacity = G.done ? 0.5 + 0.5 * Math.sin(G.time * 10) : 0.6; }
  // camera
  const portrait = W / H < 1, hgt = portrait ? 19 : 13, back = portrait ? 9 : 9.5;
  const mx = Math.max(0, R.W / 2 - (portrait ? 4 : 8.5)), mz = Math.max(0, R.D / 2 - (portrait ? 4.5 : 4)); const tx = clamp(P.x, -mx, mx), tz = clamp(P.z + (portrait ? 2.5 : 0.8), -mz, mz);
  camPos.lerp(V3.set(tx, hgt, tz + back), Math.min(1, dt * 4));
  camera.position.copy(camPos);
  if (G.shake > 0) { camera.position.x += rnd(-1, 1) * G.shake; camera.position.y += rnd(-1, 1) * G.shake; G.shake = Math.max(0, G.shake - dt * 1.5); }
  camera.lookAt(camPos.x, 0, camPos.z - back);
  sun.position.set(camPos.x - 8, 18, camPos.z); sun.target.position.set(camPos.x, 0, camPos.z - back); sun.target.updateMatrixWorld();
  // HUD
  const pct = cleanPct();
  $('#cleanFill').style.width = Math.min(100, pct * 100) + '%'; $('#cleanTxt').textContent = Math.round(pct * 100) + '%';
  $('#batFill').style.width = (bf * 100) + '%'; $('#batTxt').textContent = '🔋' + Math.round(bf * 100) + '%';
  $('#credits').textContent = '◆ ' + G.credits; $('#score').textContent = 'Score ' + G.score; $('#rank').textContent = RNAMES[G.rank];
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('#toast').style.opacity = 0; }
}
function renderOnce() { sync(0.016); renderer.render(scene, camera); }
let last = performance.now(), FR = 0;
function loop(now) {
  requestAnimationFrame(loop); FR++;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G.state === 'play') update(dt);
  else if (motorGain) motorGain.gain.value = 0;
  if (R) { if (G.state !== 'paused') updateParts(dt); sync(G.state === 'paused' ? 0 : dt); }
  else { camera.position.set(0, 12, 10); camera.lookAt(0, 0, 0); }
  renderer.render(scene, camera);
}
function resize() { W = innerWidth; H = innerHeight; renderer.setSize(W, H); camera.aspect = W / H; camera.fov = W / H < 1 ? 60 : 48; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// title backdrop: show the kitchen
buildRoom(0); titleScreen();
requestAnimationFrame(loop);

window.__cp = {
  get state() { return G.state; }, get room() { return G.room; }, get clean() { return cleanPct(); }, get battery() { return P.bat; }, get credits() { return G.credits; },
  get frames() { return FR; }, get pos() { return [P.x, P.z]; }, get pets() { return pets.map(p => p.t + ':' + p.st); },
  goto(n) { G.room = clamp(n | 0, 0, ROOMS.length - 1); initAudio(); intro(); startPlay(); return R.name; },
  teleport(x, z) { P.x = x; P.z = z; }, give(c) { G.credits += c; },
  cleanTo(f) { const alive = dirt.filter(d => d.alive); for (const d of alive) { if (cleanPct() >= f) break; d.alive = false; gainDirt(d.v); setDirtMatrix(d); } dirtMesh.instanceMatrix.needsUpdate = true; return cleanPct(); },
  shop() { workshop('Debug workshop'); }, drain() { P.bat = 0.5; },
};
</script>

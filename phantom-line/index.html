let hudT = 0;

// ---------- camera ----------
function placeCamera() {
  const port = H > W; const baseYaw = port ? Math.PI / 2 : 0; const a = baseYaw + yaw * Math.PI / 2;
  const pitch = 0.95, fov = camera.fov * Math.PI / 180, tn = Math.tan(fov / 2), asp = W / H || 1;
  const along = (Math.abs(Math.cos(a)) > 0.5) ? [GW, GH] : [GH, GW];
  const hw = along[0] / 2 + 0.8, hd = along[1] / 2 + 0.8;
  const dist = Math.max(hw / (tn * asp), (hd * Math.sin(pitch) + 1.2) / tn) * 1.08 + 2.5;
  camera.position.set(-Math.sin(a) * 0 + Math.sin(a) * Math.cos(pitch) * dist * 0 + 0, Math.sin(pitch) * dist, Math.cos(pitch) * dist);
  const r = Math.cos(pitch) * dist; camera.position.set(Math.sin(a) * r, Math.sin(pitch) * dist, Math.cos(a) * r);
  camera.lookAt(0, 0, 0.6 * Math.cos(a) * 0 + 0.0);
  if (scene.fog) { scene.fog.near = dist * 0.9; scene.fog.far = dist * 2.6; } camera.updateProjectionMatrix();
}

// ---------- input ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
function pickTile(cx, cy) { ndc.set(cx / W * 2 - 1, -(cy / H) * 2 + 1); ray.setFromCamera(ndc, camera); if (!ray.ray.intersectPlane(plane, hit)) return null; const gx = Math.floor(hit.x + GW / 2), gy = Math.floor(hit.z + GH / 2); return { gx, gy }; }
cv.addEventListener('pointermove', e => { if (state !== 'play' || e.pointerType === 'touch') return; const p = pickTile(e.clientX, e.clientY); if (p) { curGX = p.gx; curGY = p.gy; } });
cv.addEventListener('pointerdown', e => { if (state !== 'play') return; const p = pickTile(e.clientX, e.clientY); if (!p) return; curGX = p.gx; curGY = p.gy; act(); });
function act() {
  if (curGX < 0 || curGX >= GW || curGY < 0 || curGY >= GH) { selTower = null; showPanel(); return; }
  const t = towers.find(t => t.gx === curGX && t.gy === curGY);
  if (t) { selTower = selTower === t ? null : t; SFX.click(); showPanel(); return; }
  selTower = null; showPanel();
  if (grid[curGX][curGY] === 0) build(selTool, curGX, curGY);
}
addEventListener('keydown', e => {
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { toggleMute(); return; }
  if (state !== 'play') { if ((e.code === 'Enter' || e.code === 'Space') && document.getElementById('go')) { e.preventDefault(); document.getElementById('go').click(); } return; }
  const k = e.code;
  const dirs = { ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0], ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1] };
  if (dirs[k]) { e.preventDefault(); let [dx, dy] = dirs[k]; const a = ((H > W ? 1 : 0) + yaw) % 4; for (let i = 0; i < a; i++) { const t = dx; dx = -dy; dy = t; } curGX = Math.max(0, Math.min(GW - 1, curGX + dx)); curGY = Math.max(0, Math.min(GH - 1, curGY + dy)); }
  if (k === 'Space' || k === 'Enter') { e.preventDefault(); act(); }
  if (k >= 'Digit1' && k <= 'Digit4') { selTool = +k.slice(5) - 1; selTower = null; showPanel(); buildBar(); }
  if (k === 'KeyN') startWave();
  if (k === 'KeyU') upgrade(selTower);
  if (k === 'KeyX') sell(selTower);
  if (k === 'KeyQ') { yaw = (yaw + 3) % 4; placeCamera(); }
  if (k === 'KeyE') { yaw = (yaw + 1) % 4; placeCamera(); }
  if (k === 'KeyF') toggleFast();
});
document.getElementById('bRot').onclick = () => { yaw = (yaw + 1) % 4; placeCamera(); SFX.click(); };
document.getElementById('bFast').onclick = toggleFast;
document.getElementById('bPause').onclick = () => togglePause();
document.getElementById('bMute').onclick = () => toggleMute();
function toggleFast() { fast = fast === 1 ? 2 : 1; document.getElementById('bFast').style.background = fast === 2 ? '#6a2a14' : ''; }
function toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.4; document.getElementById('bMute').textContent = muted ? '🔇' : '♪'; }

// ---------- HUD ----------
const statsEl = document.getElementById('stats'), barEl = document.getElementById('bar'), panelEl = document.getElementById('panel'), msgEl = document.getElementById('msg');
function updHud() {
  statsEl.innerHTML = `<b>${level + 1}. ${LEVELS[level].name}</b><br>❤ ${lives} &nbsp; 🪙 ${gold} &nbsp; 🌊 ${wave}/${waveTotal}${!waveActive && wave < waveTotal && state === 'play' ? ` · next ${Math.ceil(Math.max(0, waveTimer))}s` : ''}<br>Score ${score}`;
  barEl.querySelectorAll('button[data-t]').forEach(b => { const T = TOWERS[+b.dataset.t]; b.classList.toggle('poor', gold < T.cost); });
}
function buildBar() {
  barEl.innerHTML = TOWERS.map((T, i) => `<button data-t="${i}" class="${i === selTool ? 'sel' : ''} ${T.unlock > level ? 'locked' : ''}" title="${T.n}: ${T.desc}"><span class="ic">${T.unlock > level ? '🔒' : T.ic}</span>${T.unlock > level ? 'Lv ' + (T.unlock + 1) : T.cost}</button>`).join('') + `<button id="bNext"><span class="ic">🚂</span>Wave</button>`;
  barEl.querySelectorAll('button[data-t]').forEach(b => b.onclick = () => { selTool = +b.dataset.t; selTower = null; showPanel(); SFX.click(); buildBar(); });
  document.getElementById('bNext').onclick = () => startWave(); updHud();
}
function showPanel() {
  if (!selTower) { panelEl.style.display = 'none'; rangeRing.visible = false; return; }
  const t = selTower, s = tStat(t); panelEl.style.display = 'block';
  panelEl.innerHTML = `<b>${t.T.ic} ${t.T.n}</b> · level ${t.lvl + 1}/3<br><span class="small">dmg ${Math.round(s.dmg)} · range ${s.r.toFixed(1)}</span><br>${t.lvl < 2 ? `<button id="pUp">⬆ Upgrade (${upCost(t)})</button>` : ''}<button id="pSell">Sell (+${Math.round(t.spent * 0.7)})</button><button id="pX">✕</button>`;
  const u = document.getElementById('pUp'); if (u) u.onclick = () => upgrade(t);
  document.getElementById('pSell').onclick = () => sell(t); document.getElementById('pX').onclick = () => { selTower = null; showPanel(); };
}
function flash(s) { msgEl.textContent = s; msgEl.style.opacity = 1; msgT = 1.6; }

// ---------- flow ----------
const ov = document.getElementById('ov'), card = document.getElementById('card');
function show(h) { card.innerHTML = h; ov.classList.remove('hide'); card.scrollTop = 0; }
function hideOv() { ov.classList.add('hide'); }
const CTL = `<table class="ctl"><tr><td><b>Build / select</b></td><td>Click or tap a tile · arrows/WASD + Space</td></tr><tr><td><b>Tower type</b></td><td>1–4 or the bottom bar</td></tr><tr><td><b>Upgrade / Sell</b></td><td>U / X or the tower panel</td></tr><tr><td><b>Next wave</b></td><td>N or 🚂 (early call = bonus coins)</td></tr><tr><td><b>Rotate · Speed</b></td><td>Q/E · F, or ⟳ ⏩</td></tr><tr><td><b>Pause / Mute</b></td><td>P or Esc / M · ⏸ ♪</td></tr></table>`;
function titleScreen() {
  state = 'title'; panelEl.style.display = 'none';
  show(`<h1>🚂 PHANTOM LINE</h1><p><b>A haunted-railway tower defense.</b> Every night at 12:13 a ghost train pulls into Hollow Vale, and its passengers want to haunt the town.</p>
  <p class="small">Build lanterns, bells, salt mortars and prisms beside the tracks to stop the spirits before they reach the station. 10 lines, each spookier than the last.</p>${CTL}
  <button class="btn" id="go">Start the night shift</button><p class="small">High score: ${hiScore}</p>`);
  document.getElementById('go').onclick = () => { initAudio(); SFX.click(); level = 0; score = 0; kills = 0; intro(); };
}
function intro() {
  state = 'intro'; const L = LEVELS[level];
  buildLevel(); placeCamera();
  show(`<p class="small">LINE ${level + 1} OF 10</p><h2>${L.name}</h2><p>${L.story}</p>${level >= 1 && level <= 3 ? `<p class="small">New tower: ${TOWERS[level].ic} <b>${TOWERS[level].n}</b> (${TOWERS[level].desc})</p>` : ''}<button class="btn" id="go">Begin</button>`);
  document.getElementById('go').onclick = () => { SFX.click(); hideOv(); startLevel(); };
}
function startLevel() {
  gold = 160 + level * 45; lives = 20; wave = 0; waveTotal = waveCount(); waveActive = false; waveTimer = 25; spawnQ = []; selTower = null; selTool = 0;
  state = 'play'; buildBar(); showPanel(); flash(LEVELS[level].name); updHud();
}
function levelClear() {
  state = 'between'; const bonus = lives * 50 + gold; score += bonus; saveHi(); SFX.win();
  if (level >= LEVELS.length - 1) return winGame();
  show(`<h2>✨ ${LEVELS[level].name} is quiet again</h2><p>All passengers sent back to the fog.</p><p>Lives bonus + leftover coins: <b>+${bonus}</b><br>Score <b>${score}</b></p><button class="btn" id="go">Next line</button>`);
  document.getElementById('go').onclick = () => { SFX.click(); level++; intro(); };
}
function gameOver() {
  state = 'over'; saveHi(); panelEl.style.display = 'none';
  show(`<h1>The Town Is Haunted</h1><p>Too many spirits reached the station on <b>${LEVELS[level].name}</b>.</p><p>Score <b>${score}</b> · Ghosts banished ${kills}</p><p class="small">High score: ${hiScore}</p><button class="btn" id="go">Retry this line</button><button class="btn alt" id="tt">Title</button>`);
  document.getElementById('go').onclick = () => { SFX.click(); intro(); }; document.getElementById('tt').onclick = titleScreen;
}
function winGame() {
  state = 'win'; saveHi();
  show(`<h1>🌅 Dawn at Hollow Vale</h1><p>The 12:13 will never run again. You held all ten lines.</p><p>Final score <b>${score}</b> · Ghosts banished ${kills}</p><p class="small">High score: ${hiScore}</p><button class="btn" id="go">Play again</button><button class="btn alt" id="tt">Title</button>`);
  document.getElementById('go').onclick = () => { SFX.click(); level = 0; score = 0; kills = 0; intro(); }; document.getElementById('tt').onclick = titleScreen;
}
function saveHi() { if (score > hiScore) { hiScore = score; try { localStorage.setItem(HI_KEY, String(hiScore)); } catch (e) {} } }
function togglePause() {
  if (state === 'play') { state = 'paused'; show(`<h2>Paused</h2>${CTL}<button class="btn" id="go">Resume</button><button class="btn alt" id="tt">Quit to title</button>`); document.getElementById('go').onclick = togglePause; document.getElementById('tt').onclick = titleScreen; }
  else if (state === 'paused') { state = 'play'; hideOv(); }
}
window.__autoPause = () => { if (state === 'play') togglePause(); };

// ---------- loop ----------
function loop() {
  const dt = Math.min(0.05, clock.getDelta());
  try { update(dt); } catch (e) { console.warn(e); }
  const okT = state === 'play' && curGX >= 0 && curGX < GW && curGY >= 0 && curGY < GH;
  cursor.visible = okT; if (okT) { const [x, z] = toWorld(curGX, curGY); cursor.position.set(x, 0.1, z); const occ = towers.some(t => t.gx === curGX && t.gy === curGY); cursor.material.color.set(occ ? 0x80c0ff : canBuild(curGX, curGY) && gold >= TOWERS[selTool].cost && TOWERS[selTool].unlock <= level ? 0xffd884 : 0xff5050); }
  const rt = selTower || (okT && canBuild(curGX, curGY) ? { x: toWorld(curGX, curGY)[0], z: toWorld(curGX, curGY)[1], r: TOWERS[selTool].r } : null);
  if (rt && state === 'play') { const r = selTower ? tStat(selTower).r : rt.r; rangeRing.visible = true; rangeRing.position.x = rt.x; rangeRing.position.z = rt.z; rangeRing.scale.set(r, r, 1); } else rangeRing.visible = false;
  if (shake > 0) { shake -= dt; camera.position.x += (Math.random() - 0.5) * shake * 0.5; }
  else if (state !== 'title') placeCamera();
  if (state === 'title') { const t = performance.now() / 6000; camera.position.set(Math.sin(t) * 18, 10, Math.cos(t) * 18); camera.lookAt(0, 0, 0); }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
buildLevel(); resize(); titleScreen(); requestAnimationFrame(loop);

window.__phl = {
  get state() { return state; }, get level() { return level; }, get wave() { return wave; }, get gold() { return gold; }, get lives() { return lives; }, get score() { return score; },
  get enemies() { return enemies.length; }, get towers() { return towers.length; },
  goto(n) { initAudio(); level = Math.max(0, Math.min(9, n)); hideOv(); buildLevel(); startLevel(); placeCamera(); },
  place(ti, gx, gy) { return !!build(ti, gx, gy); }, nextWave() { startWave(); }, cash(n = 1000) { gold += n; updHud(); },
  kill() { enemies.forEach(e => damage(e, 1e9)); }, win() { wave = waveTotal; waveActive = true; spawnQ = []; enemies.forEach(e => damage(e, 1e9)); },
  cursor(gx, gy) { curGX = gx; curGY = gy; }, select(gx, gy) { curGX = gx; curGY = gy; act(); }, spawn(t) { return !!spawn(t); },
  free() { const out = []; for (let x = 0; x < GW; x++) for (let y = 0; y < GH; y++) if (canBuild(x, y)) out.push([x, y]); return out; },
};
</script>
